<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jebii ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Allura&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9acb;
  --gold:#f5c77a;
  --glass:rgba(255, 255, 255, 0.15);
  --accent: #ff4f9a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins', sans-serif;
  background: radial-gradient(circle at center, #7a003c, #2b0014);
  color:white;
  overflow:hidden;
  height: 100vh;
}

#hearts-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

.story{
  height:100vh;width:100vw;display:none;
  align-items:center;justify-content:center;
  text-align:center;padding:20px;
  position: relative;
  z-index: 2;
}
.story.active{display:flex; animation: fadeIn 0.8s ease-out;}

.card{
  max-width:450px;width:100%;
  background:var(--glass);
  backdrop-filter:blur(25px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius:35px;padding:30px 20px;
  box-shadow:0 25px 50px rgba(0,0,0,0.4);
  position:relative;
}

h1{font-family:'Allura',cursive;font-size:55px;color:var(--gold);text-shadow: 2px 2px 10px rgba(0,0,0,0.3);}
p{margin:15px 0;line-height:1.6; font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem;}

button {
  padding:12px 30px; border:none; border-radius:50px;
  background:linear-gradient(135deg, var(--pink), var(--accent));
  color:white; font-weight:600; cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 10px 20px rgba(255, 79, 154, 0.4);
  position: relative;
  z-index: 10;
}

#muteBtn{
  position:fixed;top:20px;right:20px;
  background:var(--glass); border-radius:50%; width:50px; height:50px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:1000; border: 1px solid rgba(255,255,255,0.3);
}

/* 4x4 PUZZLE STYLES */
.puzzle-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  width: 300px;
  height: 300px;
  margin: 15px auto;
  background: rgba(255,255,255,0.1);
  padding: 8px;
  border-radius: 12px;
}
.tile {
  width: 68px;
  height: 68px;
  background-color: var(--pink);
  background-image: url('photo1.jpg');
  background-size: 280px 280px; /* Adjusted for 4x4 */
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s ease;
}
.tile.empty {
  background: transparent !important;
  border: 1px dashed rgba(255,255,255,0.2);
}

.floating-heart {
  position: absolute; background-color: var(--pink);
  transform: rotate(-45deg); opacity: 0.8; animation: floatUp linear infinite;
}
.floating-heart::before, .floating-heart::after {
  content: ""; position: absolute; width: 100%; height: 100%;
  background-color: inherit; border-radius: 50%;
}
.floating-heart::before { top: -50%; left: 0; }
.floating-heart::after { top: 0; left: 50%; }

@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(-45deg) scale(0.8); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-20vh) rotate(-45deg) scale(1.2); opacity: 0; }
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="hearts-container"></div>
<div id="muteBtn">🔇</div>

<audio id="bgMusic" loop preload="auto">
  <source src="Aval.mp3" type="audio/mpeg">
</audio>

<div class="story active">
  <div class="card">
    <h1>Hey Jebii 💗</h1>
    <p>I made this little space to tell you something special...</p>
    <button onclick="nextStory()">Open My Heart</button>
  </div>
</div>

<div class="story">
  <div class="card">
    <h1>A Memory to Fix 🧩</h1>
    <p id="puzzleText">This one is a bit harder, just like finding someone as perfect as you...</p>
    <div id="puzzleGrid" class="puzzle-grid"></div>
    <button id="puzzleContinue" style="display:none; margin-top: 10px;" onclick="nextStory()">Continue ❤️</button>
  </div>
</div>

<div class="story">
  <div class="card" id="proposalCard">
    <h1 style="font-size: 45px;">One last thing...</h1>
    <p>Will You Be Mine? 💍</p>
    <div style="display:flex; justify-content: center; gap: 40px; min-height: 200px; align-items: center; position: relative;">
        <button onclick="yes()">YES 💖</button>
        <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">NO</button>
    </div>
  </div>
</div>

<script>
const stories = document.querySelectorAll('.story');
const music = document.getElementById('bgMusic');
const muteBtn = document.getElementById('muteBtn');
let current = 0;

function createHeart() {
  const container = document.getElementById('hearts-container');
  const heart = document.createElement('div');
  heart.className = 'floating-heart';
  const size = Math.random() * 12 + 8 + 'px';
  heart.style.width = size; heart.style.height = size;
  heart.style.left = Math.random() * 100 + 'vw';
  // Randomized speeds for the floating hearts
  heart.style.animationDuration = Math.random() * 4 + 3 + 's';
  container.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 300);

function nextStory() {
  if(current === 0) { 
    music.play().catch(() => {}); 
    muteBtn.textContent = '🔊'; 
  }
  stories[current].classList.remove('active');
  current++;
  if(current < stories.length) {
    stories[current].classList.add('active');
    if(stories[current].querySelector('#puzzleGrid')) initPuzzle();
  }
}

/* 4x4 PUZZLE LOGIC */
let board = Array.from({length: 16}, (_, i) => (i + 1) % 16);
const goal = [...board];

function initPuzzle() {
    // Shuffle
    for(let i = 0; i < 200; i++) {
        const emptyIdx = board.indexOf(0);
        const neighs = getNeighbors(emptyIdx);
        const rand = neighs[Math.floor(Math.random() * neighs.length)];
        [board[emptyIdx], board[rand]] = [board[rand], board[emptyIdx]];
    }
    renderBoard();
}

function getNeighbors(i) {
    const res = [];
    if (i % 4 > 0) res.push(i - 1);
    if (i % 4 < 3) res.push(i + 1);
    if (i > 3) res.push(i - 4);
    if (i < 12) res.push(i + 4);
    return res;
}

function renderBoard() {
    const grid = document.getElementById('puzzleGrid');
    grid.innerHTML = '';
    board.forEach((val, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile' + (val === 0 ? ' empty' : '');
        if(val !== 0) {
            const r = Math.floor((val-1)/4);
            const c = (val-1)%4;
            // 70px offset for 4x4 grid
            tile.style.backgroundPosition = `-${c*70}px -${r*70}px`;
            tile.onclick = () => {
                const emptyIdx = board.indexOf(0);
                if(getNeighbors(i).includes(emptyIdx)) {
                    [board[i], board[emptyIdx]] = [board[emptyIdx], board[i]];
                    renderBoard();
                    if(JSON.stringify(board) === JSON.stringify(goal)) {
                        document.getElementById('puzzleText').innerText = "You fixed it! Just like you fix my bad days.";
                        document.getElementById('puzzleContinue').style.display = "block";
                    }
                }
            };
        }
        grid.appendChild(tile);
    });
}

function moveNo() {
    const btn = document.getElementById('noBtn');
    btn.style.position = 'fixed';
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
}

function yes() {
  document.body.innerHTML = `<div class="story active" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
      <div id="hearts-container"></div>
      <div class="card"><h1>Forever Started! 💗</h1><p>I promise to love you always, Jebii.</p><span>💖</span></div>
    </div>`;
  setInterval(createHeart, 50);
}

muteBtn.onclick = () => {
  if(music.paused) { music.play(); muteBtn.textContent = '🔊'; }
  else { music.pause(); muteBtn.textContent = '🔇'; }
};
</script>
</body>
</html>
