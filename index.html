<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jebii ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Allura&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#ff9acb;
  --gold:#f5c77a;
  --glass:rgba(255, 255, 255, 0.15);
  --accent: #ff4f9a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins', sans-serif;
  background: radial-gradient(circle at center, #7a003c, #2b0014);
  color:white;
  overflow:hidden;
  height: 100vh;
}

#hearts-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

.story{
  height:100vh;width:100vw;display:none;
  align-items:center;justify-content:center;
  text-align:center;padding:20px;
  position: relative;
  z-index: 2;
}
.story.active{display:flex; animation: fadeIn 0.8s ease-out;}

.card{
  max-width:420px;width:100%;
  background:var(--glass);
  backdrop-filter:blur(25px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius:35px;padding:40px 30px;
  box-shadow:0 25px 50px rgba(0,0,0,0.4);
  position:relative;
  overflow: hidden; /* Keeps the NO button inside the box */
}

h1{font-family:'Allura',cursive;font-size:55px;color:var(--gold);text-shadow: 2px 2px 10px rgba(0,0,0,0.3);}
p{margin:20px 0;line-height:1.8; font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.2rem;}

button {
  padding:15px 35px; border:none; border-radius:50px;
  background:linear-gradient(135deg, var(--pink), var(--accent));
  color:white; font-weight:600; cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 10px 20px rgba(255, 79, 154, 0.4);
}

#muteBtn{
  position:fixed;top:20px;right:20px;
  background:var(--glass); border-radius:50%; width:50px; height:50px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:1000; border: 1px solid rgba(255,255,255,0.3);
}

.scene{width:200px; height:200px; margin:40px auto; perspective:1200px;}
.cube{
  width:100%; height:100%; position:relative;
  transform-style:preserve-3d; animation:spin 15s linear infinite;
}
.cube div{
  position:absolute; width:200px; height:200px;
  background-size:cover; background-position:center;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 15px;
}

/* Matching your GitHub files */
.cube .front{transform:translateZ(100px); background-image:url('photo1.jpg')}
.cube .back{transform:rotateY(180deg) translateZ(100px); background-image:url('photo2.jpg')}
.cube .right{transform:rotateY(90deg) translateZ(100px); background-image:url('photo3.jpg')}
.cube .left{transform:rotateY(-90deg) translateZ(100px); background-image:url('photo4.jpg')}
.cube .top{transform:rotateX(90deg) translateZ(100px); background-image:url('photo5.jpg')}
.cube .bottom{transform:rotateX(-90deg) translateZ(100px); background-image:url('photo6.jpg')}

@keyframes spin{ from{transform:rotateX(-20deg) rotateY(0deg)} to{transform:rotateX(-20deg) rotateY(360deg)} }

video {
  width: 100%; border-radius: 20px; margin: 15px 0; background: black;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

#noBtn{ 
  position: relative; 
  background:#33001a; 
  color:white; 
  transition: 0.1s; 
  z-index: 10;
}

.floating-heart {
  position: absolute; background-color: var(--pink);
  transform: rotate(-45deg); opacity: 0.8; animation: floatUp linear infinite;
}
.floating-heart::before, .floating-heart::after {
  content: ""; position: absolute; width: 100%; height: 100%;
  background-color: inherit; border-radius: 50%;
}
.floating-heart::before { top: -50%; left: 0; }
.floating-heart::after { top: 0; left: 50%; }

@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(-45deg) scale(1); opacity: 1; }
  100% { transform: translateY(-20vh) rotate(-45deg) scale(1.5); opacity: 0; }
}
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<div id="hearts-container"></div>
<div id="muteBtn">🔇</div>

<audio id="bgMusic" loop preload="auto">
  <source src="Aval.mp3" type="audio/mpeg">
</audio>

<div class="story active" onclick="nextStory()">
  <div class="card">
    <h1>Hey Jebii 💗</h1>
    <p>I made this little space to tell you something special...</p>
    <div style="opacity:0.5; font-size:12px;">Tap to open my heart</div>
  </div>
</div>

<div class="story" onclick="nextStory()">
  <div class="card">
    <p>"In your eyes, I found my favorite view. In your heart, I found my home."</p>
  </div>
</div>

<div class="story" onclick="nextStory()">
  <div class="card">
    <h1>Ennavaleyy💞</h1>
    <div class="scene">
      <div class="cube">
        <div class="front"></div><div class="back"></div>
        <div class="right"></div><div class="left"></div>
        <div class="top"></div><div class="bottom"></div>
      </div>
    </div>
  </div>
</div>

<div class="story">
  <div class="card">
    <h1>Press Play 🎥</h1>
    <video id="myVideo" playsinline controls preload="metadata">
      <source src="video.mp4" type="video/mp4">
    </video>
    <button onclick="nextStory()" style="margin-top:10px">Continue ❤️</button>
  </div>
</div>

<div class="story">
  <div class="card" id="proposalCard">
    <h1 style="font-size: 45px;">One last thing...</h1>
    <p>Will You Be Mine? 💍</p>
    <div style="display:flex; justify-content: space-around; align-items: center; min-height: 150px; position: relative;">
        <button onclick="yes()">YES 💖</button>
        <button id="noBtn">NO</button>
    </div>
  </div>
</div>

<script>
const stories = document.querySelectorAll('.story');
const music = document.getElementById('bgMusic');
const muteBtn = document.getElementById('muteBtn');
const video = document.getElementById('myVideo');
let current = 0;

function createHeart() {
  const container = document.getElementById('hearts-container');
  const heart = document.createElement('div');
  heart.className = 'floating-heart';
  const size = Math.random() * 15 + 10 + 'px';
  heart.style.width = size; heart.style.height = size;
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = Math.random() * 3 + 4 + 's';
  container.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 400);

function nextStory() {
  if(current === 0) { 
    music.play().catch(() => {}); 
    muteBtn.textContent = '🔊'; 
  }
  
  // Lower music volume during video
  if(current === 2) { 
    music.volume = 0.1; 
  } else {
    music.volume = 0.5;
    video.pause();
  }

  stories[current].classList.remove('active');
  current++;
  if(current < stories.length) stories[current].classList.add('active');
}

function yes() {
  document.body.innerHTML = `
    <div class="story active">
      <div class="card">
        <h1>Forever Started! 💗</h1>
        <p>I promise to love you always, Jebii.</p>
        <div style="font-size: 50px;">💖</div>
      </div>
    </div>`;
  setInterval(createHeart, 50);
}

const noBtn = document.getElementById('noBtn');
const card = document.getElementById('proposalCard');

noBtn.onmouseover = noBtn.ontouchstart = (e) => {
  if(e.type === 'touchstart') e.preventDefault();
  noBtn.style.position = 'absolute';
  
  const maxX = card.clientWidth - noBtn.offsetWidth - 30;
  const maxY = card.clientHeight - noBtn.offsetHeight - 30;
  
  const x = Math.random() * maxX + 15;
  const y = Math.random() * maxY + 15;
  
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
};
</script>
</body>
</html>
